name: Offline Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run fixture tests without SSH
        run: python -m unittest discover -s tests -v
